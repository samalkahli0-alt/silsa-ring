<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💎 محاكاة مقاس الخاتم — SILSA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffeed3;
      --ink:#3e000c;
      --muted:#7e4a55;
      --card:#fff7ea;
      --border:#f1d7b8;
      --accent:#b8860b;
      --accent-2:#d4af37;
      --danger:#c81e1e;
      --navy:#001f3f;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:'Tajawal',system-ui,sans-serif;
    }

    .wrap{max-width:1100px;margin:24px auto;padding:16px}
    .title{font-size:28px;font-weight:800;margin-bottom:14px}

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      margin-bottom:18px;
    }

    svg{max-width:380px;margin:auto;display:block}

    .ring-stroke{stroke:#3e000c;stroke-width:6;fill:transparent}
    .ring-stroke-inner{stroke:#3e000c;stroke-width:3;fill:white}

    .diamond{animation:sparkle 1.3s infinite}
    @keyframes sparkle{
      0%{fill:#89CFF0}
      50%{fill:#bde3fb}
      100%{fill:#89CFF0}
    }

    input,select{
      width:100%;padding:10px;border-radius:12px;
      border:1px solid var(--border);font-size:16px
    }

    input[type=range]{appearance:none;height:6px;background:#ead8bb;border-radius:999px}
    input[type=range]::-webkit-slider-thumb{
      appearance:none;width:18px;height:18px;border-radius:50%;
      background:var(--accent-2);border:2px solid white;
    }
  </style>
</head>

<body>

<div class="wrap">
  <h1 class="title">💎 اعرف مقاسك</h1>

  <div class="card">
    <div id="sizeLabel" style="font-weight:800;font-size:18px;margin-bottom:10px">
      المقاس الحالي: — (US)
    </div>

    <svg id="ringSvg" viewBox="0 0 360 360">
      <circle id="outer" class="ring-stroke" cx="180" cy="190" r="60" />
      <circle id="inner" class="ring-stroke-inner" cx="180" cy="190" r="35" />
      <polygon id="diamond" class="diamond"
        points="180,90 170,100 180,110 190,100"
        stroke="#5a9bd4" stroke-width="2" />
    </svg>

    <input id="slider" type="range" min="4" max="14" step="0.5" value="8" />
  </div>

  <div class="card">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><label>US</label><input id="us"></div>
      <div><label>UK</label><input id="uk"></div>
      <div><label>FR</label><input id="fr"></div>
      <div><label>JP</label><input id="jp"></div>
      <div><label>القطر (mm)</label><input id="diameter"></div>
      <div><label>المحيط (mm)</label><input id="circ"></div>

      <div id="error" style="color:var(--danger);font-weight:bold"></div>
      <div id="laser" style="color:var(--navy);font-weight:bold"></div>
    </div>
  </div>
</div>

<script>
/************* ثوابت *************/
const PI = Math.PI;
const US_MIN = 4, US_MAX = 14;
let pxPerMM = 6.8;

/************* تحويلات *************/
const usToDiameter = us => 11.63 + 0.8128 * us;
const diameterToUs = d  => (d - 11.63) / 0.8128;
const usToJP = us => us + 12;
const diameterToCirc = d => PI * d;

/************* منطق الماكينة (Refactor) *************/
function getMachineCircumference(diameterMM){
  return PI * diameterMM; // محيط دائري مغلق بالملّيمتر
}

/************* عناصر *************/
const $ = id => document.getElementById(id);
const el = {
  us:$("us"), uk:$("uk"), fr:$("fr"), jp:$("jp"),
  diameter:$("diameter"), circ:$("circ"),
  slider:$("slider"),
  sizeLabel:$("sizeLabel"),
  error:$("error"),
  laser:$("laser"),
  inner:$("inner"), outer:$("outer"), diamond:$("diamond")
};

let updating = false;
const fmt = n => Number(n).toFixed(2).replace(/\.00$/,'');

/************* الرسم *************/
function drawRing(diameterMM){
  const innerR = (diameterMM / 2) * pxPerMM;
  const outerR = innerR + 6;

  el.inner.setAttribute('r', innerR);
  el.outer.setAttribute('r', outerR);

  const cx = 180, cy = 190;
  const dy = cy - outerR - 20;
  el.diamond.setAttribute(
    'points',
    `${cx},${dy-8} ${cx-10},${dy} ${cx},${dy+8} ${cx+10},${dy}`
  );
}

/************* التحديث الرئيسي *************/
function updateAllFromUS(us){
  if(us < US_MIN || us > US_MAX){
    el.error.textContent = "❌ المقاس خارج النطاق";
    return;
  }
  el.error.textContent = "";

  const d = usToDiameter(us);                 // القطر الحقيقي
  const c = getMachineCircumference(d);       // ⭐ قيمة الماكينة

  updating = true;
  el.us.value = fmt(us);
  el.fr.value = fmt(c);
  el.jp.value = fmt(usToJP(us));
  el.diameter.value = fmt(d);
  el.circ.value = fmt(c);
  el.slider.value = us;
  updating = false;

  el.sizeLabel.textContent = `المقاس الحالي: ${fmt(us)} (US)`;
  el.laser.textContent = `⚙️ قيمة القص (محيط دائري مغلق): ${fmt(c)} mm`;

  drawRing(d);
}

/************* أحداث *************/
el.slider.addEventListener('input', e=>{
  if(!updating) updateAllFromUS(parseFloat(e.target.value));
});
el.us.addEventListener('input', e=>{
  if(!updating) updateAllFromUS(parseFloat(e.target.value));
});

updateAllFromUS(8);
</script>

</body>
</html>
